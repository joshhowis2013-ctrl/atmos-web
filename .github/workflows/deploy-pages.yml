name: Deploy Atmos Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static example site
        run: |
          rm -rf _site
          mkdir -p _site/docs
          cp index.html overview.html pressure.html configure.html _site/
          cp app.js styles.css overview.css pressure.js pressure.css _site/
          cp manifest.webmanifest sw.js icon.svg _site/
          cp docs/*.html _site/docs/

      - name: Upload static example
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
